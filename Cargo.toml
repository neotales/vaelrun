[package]
name = "vaelrun"
version = "0.0.0-alpha.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Neotales"]
description = "cross-platform run, open, and start"
readme = "README.md"

[[bin]]
name = "vrun"
path = "src/main.rs"

[dependencies]
neotales-dotenv = { path = "third_party/neotales-dotenv", version = "0.0.0-alpha.1" }
neotales-env = { path = "third_party/neotales-env", version = "0.0.0-alpha.1" }

[dev-dependencies]
tempfile = "3.27.0"
