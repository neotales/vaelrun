[workspace]
resolver = "3"
members = [".", "e2e/env-replace"]

[package]
name = "vaelrun"
version = "0.0.0-alpha.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
authors = ["Neotales"]
description = "cross-platform run, open, and start"
readme = "README.md"
publish = false

[[bin]]
name = "vrun"
path = "src/main.rs"

[dependencies]
neotales-dotenv = "=0.0.0-alpha.1"
neotales-env = "=0.0.0-alpha.1"
neotales-exec = { path = "vendor/rs-exec/exec", version = "0.0.0-alpha.0" }
neotales-exec-script = { path = "vendor/rs-exec/exec-script", version = "0.0.0-alpha.0" }

[dev-dependencies]
tempfile = "3.27.0"
