name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
          - windows-2025
          - windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-${{ matrix.os }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Release binary
        run: cargo build --release -p vaelrun-cli

      - name: Smoke the release binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="$(target/release/vrun --version)"
          printf '%s\n' "$out"
          case "$out" in
            *vaelrun*) ;;
            *) echo "release binary stdout missing vaelrun" >&2; exit 1 ;;
          esac

      - name: Smoke the release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & 'target\release\vrun.exe' --version
          if ($LASTEXITCODE -ne 0) { throw "vrun --version exited $LASTEXITCODE" }
          Write-Output $out
          if ($out -notmatch 'vaelrun') { throw 'release binary stdout missing vaelrun' }

  scripts:
    name: scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: scripts-${{ matrix.os }}

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_key_prefix: scripts-${{ matrix.os }}

      - name: Require script hosts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in python node bun deno go uv dotnet pwsh bash; do
            if ! command -v "$name"; then
              echo "missing $name" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Require script hosts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $missing = $false
          foreach ($name in 'python', 'node', 'bun', 'deno', 'go', 'uv', 'dotnet', 'pwsh', 'bash') {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if ($null -eq $cmd) {
              Write-Output "missing $name"
              $missing = $true
            } else {
              Write-Output $cmd.Source
            }
          }
          if ($missing) { exit 1 }

      - name: Injector e2e
        run: cargo test -p env-replace

      - name: Allow unsigned pwsh scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy Bypass -Force

      - name: Script e2e
        run: cargo test -p env-replace --features e2e-scripts
