name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            ext: tar.gz
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            ext: tar.gz
          - os: macos-15
            triple: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
            ext: zip
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            ext: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-${{ matrix.os }}

      - name: Build
        run: cargo build --release --locked -p vaelrun-cli

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="target/release/vrun.exe"
          else
            bin="target/release/vrun"
          fi
          out="$("$bin" --version)"
          printf '%s\n' "$out"
          case "$out" in
            *vaelrun*) ;;
            *) echo "release binary stdout missing vaelrun" >&2; exit 1 ;;
          esac
          version="$(printf '%s\n' "$out" | awk '{print $2}')"
          version="${version//$'\r'/}"
          if [ -z "$version" ]; then
            echo "vrun --version has no version field" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          triple="${{ matrix.triple }}"
          stage="$(mktemp -d)"
          cp target/release/vrun "$stage/vrun"
          cp LICENSE README.md "$stage/"
          mkdir -p dist
          tar -C "$stage" -czf "dist/vrun-${version}-${triple}.tar.gz" vrun LICENSE README.md

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $triple = '${{ matrix.triple }}'
          $stage = Join-Path $env:RUNNER_TEMP 'vrun-package'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item 'target\release\vrun.exe' (Join-Path $stage 'vrun.exe')
          Copy-Item LICENSE, README.md $stage
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = Join-Path (Get-Location) "dist\vrun-$version-$triple.zip"
          if (Test-Path $archive) { Remove-Item -Force $archive }
          Compress-Archive -Path (Join-Path $stage 'vrun.exe'), (Join-Path $stage 'LICENSE'), (Join-Path $stage 'README.md') -DestinationPath $archive

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vrun-${{ steps.version.outputs.version }}-${{ matrix.triple }}
          path: dist/vrun-${{ steps.version.outputs.version }}-${{ matrix.triple }}.${{ matrix.ext }}
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: vrun-*
          merge-multiple: true

      - name: Write SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          found=0
          sums="$(mktemp)"
          while IFS= read -r -d '' file; do
            hash="$(sha256sum "$file" | awk '{print $1}')"
            printf '%s  %s\n' "$hash" "$(basename "$file")" >> "$sums"
            found=$((found + 1))
          done < <(find dist -type f \( -name 'vrun-*.tar.gz' -o -name 'vrun-*.zip' \) -print0)
          if [ "$found" -ne 6 ]; then
            echo "expected 6 archives, found ${found}" >&2
            find dist -type f -print >&2
            exit 1
          fi
          sort -k2 -o dist/SHA256SUMS.txt "$sums"
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
