[package]
name = "env-replace"
version = "0.0.0-alpha.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
description = "e2e dotenv injector; not part of the vrun release"

[[bin]]
name = "env-replace"
path = "src/main.rs"

[[bin]]
name = "show-env"
path = "src/bin/show-env.rs"

[dependencies]
neotales-dotenv = "=0.0.0-alpha.1"

[dev-dependencies]
vaelrun = { path = "../../vaelrun" }
tempfile = "3.27.0"

[features]
e2e-scripts = []

[[test]]
name = "injector"
path = "tests/injector.rs"

[[test]]
name = "script"
path = "tests/script.rs"
required-features = ["e2e-scripts"]
